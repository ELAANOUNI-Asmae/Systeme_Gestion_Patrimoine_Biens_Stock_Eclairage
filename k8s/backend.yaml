apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgpbse-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sgpbse-backend
  template:
    metadata:
      labels:
        app: sgpbse-backend
    spec:
      containers:
        - name: sgpbse-backend
          image: sgpbse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sgpbse
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sgpbse-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgpbse-db-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: sgpbse-backend
spec:
  selector:
    app: sgpbse-backend
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
  type: NodePort
