version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spring_postgres_db
    environment:
      # Docker va lire ces variables depuis le fichier .env
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: