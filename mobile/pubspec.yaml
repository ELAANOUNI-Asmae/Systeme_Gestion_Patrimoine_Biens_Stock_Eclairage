name: sgpbse_mobile
description: Application mobile SGPBSE - gestion du patrimoine, biens, stock et éclairage public.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  file_picker: 10.3.10
  mobile_scanner: ^5.2.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  cross_file: ^0.3.4+2
  http: ^1.2.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
